<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <meta id="theme-color" name="theme-color" content="#fbfaf7" />
    <title>Brantly Millegan</title>
    <link rel="canonical" href="https://brantly.com/" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg?v=2" />

    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://brantly.com/" />
    <meta property="og:title" content="Brantly Millegan" />
    <meta property="og:image" content="https://brantly.com/og-brantly-v2.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="Brantly Millegan"
    />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Brantly Millegan" />
    <meta name="twitter:image" content="https://brantly.com/og-brantly-v2.png" />
    <meta name="twitter:image:alt" content="Brantly Millegan" />

    <script>
      let theme = null;

      try {
        theme = localStorage.getItem("brantly-theme");
        if (theme === "light" || theme === "dark") {
          document.documentElement.dataset.theme = theme;
        }
      } catch (error) {
        // Local storage may be unavailable; the system theme remains the default.
      }

      try {
        const usesDarkTheme =
          theme === "dark" ||
          (theme !== "light" &&
            window.matchMedia("(prefers-color-scheme: dark)").matches);
        document
          .querySelector("#theme-color")
          ?.setAttribute("content", usesDarkTheme ? "#25241f" : "#fbfaf7");
      } catch (error) {
        // The default light browser chrome remains if media queries are unavailable.
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./src/main.tsx"></script>
  </body>
</html>
